services:
  - type: web
    name: plantcare-ai-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install --no-cache-dir -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: MAX_UPLOAD_MB
        value: 8
      - key: CORS_ORIGINS
        value: "*"
